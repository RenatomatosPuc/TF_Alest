# Configuração do cenário de referência da simulação do aeroporto

# Número de rodadas da simulação (cada rodada representa um minuto)
simulation.rounds=1000

# Probabilidade de uma nova aeronave chegar em cada rodada (0 a 1)
arrival.probability=0.35

# Capacidade máxima da fila de entrada; chegadas excedentes são recusadas
queue.entry.capacity=20

# Quantidade de controladores e duração da análise de cada aeronave, em rodadas
controller.count=1
controller.classification.duration=2

# Quantidade de pistas disponíveis
runway.count=1

# Duração da operação na pista por nível de prioridade, em rodadas
runway.duration.high=3
runway.duration.medium=4
runway.duration.low=5

# Probabilidade de cada aeronave pertencer a cada nível de prioridade (soma = 1)
priority.probability.high=0.05
priority.probability.medium=0.20
priority.probability.low=0.75

# Geração automática de uma semente por execução; registrá-la ao iniciar a simulação
random.seed=auto
